opensource_summary: |-
  I've been active in open source since 2008 across 150+ projects, with a focus on
  developer tooling, automation, and platform infrastructure. The following is a
  representative subset.
opensource:
  - name: jimschubert/mnemonic
    description: |-
      A local MCP server that gives LLM coding agents shared memory for project
      knowledge via scoped storage and semantic retrieval. Supports file-based YAML memory and sqlite with
      [vec1](https://sqlite.org/vec1/doc/trunk/doc/vec1.md), all self-contained
      in the binary.
    url: https://github.com/jimschubert/mnemonic
  - name: jimschubert/rumor
    description: |-
      Lightweight gRPC and HTTP/JSON mock server which allows for rapid API mocking.
      Supports generating realistic datasets from simplified or standard JSON Schema definitions.
    url: https://github.com/jimschubert/rumor
  - name: jimschubert/spray
    description: |-
      A DSL tool that turns .stencil files into API-focused artifacts, streamlining the creation of reusable request/response definitions.
      Designed to help developers generate polished, production-ready API assets quickly and consistently.
    url: https://github.com/jimschubert/spray
  - name: jimschubert/rewrite-docker
    description: |-
      OpenRewrite recipes for Docker/container image migrations. Began as a personal
      Twitch project, then was adopted at work to migrate 3,300+ production repos
      to hardened distroless images. Basis for a proposed OpenRewrite contribution
      in 2025.
    url: https://github.com/jimschubert/rewrite-docker
  - name: jimschubert/docked
    description: A Dockerfile linting tool written in Go, built to surface common Dockerfile issues and best practices during development — before they become production vulnerabilities.
    url: https://github.com/jimschubert/docked
  - name: jimschubert/labeler-action
    description: |-
      A GitHub Action for automatically applying labels to issues and pull requests based on title/description patterns.
      Written in Go; built upon [jimschubert/labeler](https://github.com/jimschubert/labeler).
    url: https://github.com/jimschubert/labeler-action
  - name: jimschubert/changelog
    description: |-
      A CLI written in Go which allows for customizable changelog generation from
      local or remote (GitHub) repositories. Also distributed as a GitHub Action:
      [beast-changelog](https://github.com/marketplace/actions/beast-changelog).
    url: https://github.com/jimschubert/changelog
  - name: jimschubert/beast-changelog-action
    description: |-
      A GitHub Action for changelog generation to keep release notes consistent and up to date with no manual effort.
      Written in Go; built upon [jimschubert/changelog](https://github.com/jimschubert/changelog).
    url: https://github.com/jimschubert/beast-changelog-action
  - name: New Tab Redirect!
    description: A Google Chrome extension which allows the user to override the browser's new tab page.
    url: https://chrome.google.com/webstore/detail/new-tab-redirect/icpgjfneehieebagbmdbhnlpiopdcmna
  - name: OpenAPI Generator Plugin
    description: An extension for Jetbrains based IDEs which provides a GUI wrapper around OpenAPI Generator.
    url: https://github.com/jimschubert/intellij-openapi-generator
