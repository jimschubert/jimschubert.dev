projects:
  summary: |
    I've been active in open source since 2008 across 150+ projects, with a focus on
    developer tooling, automation, and platform infrastructure. The following is a
    representative subset.
  list:
    - href: https://github.com/jimschubert/mnemonic
      title: jimschubert/mnemonic
      description: |
        A local MCP server which gives LLM coding agents a shared memory layer 
        for retrieving and reinforcing relevant project knowledge, reducing reliance on 
        bloated static instruction files through scoped storage and semantic retrieval.

        As a local MCP server, this allows all knowledge to be shared across all agents.

        Supports file-based YAML storage for version-controllable memory. Also supports
        sqlite with [vec1](https://sqlite.org/vec1/doc/trunk/doc/vec1.md) for heavier knowledge bases, 
        all self-contained within the binary.

    - href: https://github.com/jimschubert/rumor
      title: jimschubert/rumor
      description: |
        Lightweight gRPC and HTTP/JSON mock server which allows for rapid API mocking.
        Supports generating realistic datasets from simplified or standard JSON Schema definitions.

    - href: https://github.com/jimschubert/rewrite-docker
      title: jimschubert/rewrite-docker
      description: |
        OpenRewrite recipes for Docker and container image migrations. Started as a
        personal project (live-streamed on Twitch), subsequently adopted internally
        at work and used to migrate 3,300+ production repositories to distroless
        hardened images. Basis for a proposed contribution to the OpenRewrite project
        in 2025.

    - href: https://github.com/jimschubert/docked
      title: jimschubert/docked
      description:
        A Dockerfile linting tool written in Go, built to surface common
        Dockerfile issues and best practices during development — before they become
        production vulnerabilities.

    - href: https://github.com/jimschubert/labeler-action
      title: jimschubert/labeler-action
      description:
        A GitHub Action for automatically applying labels to issues and
        pull requests based on title/description patterns. Written in Go; paired with
        the [jimschubert/labeler](https://github.com/jimschubert/labeler) CLI/library.

    - href: https://github.com/jimschubert/changelog
      title: jimschubert/changelog
      description: |
        A CLI written in Go which allows for customizable changelog generation from
        local or remote (GitHub) repositories. Also distributed as a GitHub Action:
        [beast-changelog](https://github.com/marketplace/actions/beast-changelog).

    - href: https://chrome.google.com/webstore/detail/new-tab-redirect/icpgjfneehieebagbmdbhnlpiopdcmna
      title: New Tab Redirect!
      description:
        A Google Chrome extension which allows the user to override the
        browser's new tab page.

    - href: https://github.com/jimschubert/intellij-openapi-generator
      title: OpenAPI Generator Plugin
      description:
        An extension for Jetbrains based IDEs which provides a GUI wrapper
        around OpenAPI Generator.

